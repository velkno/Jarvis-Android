name: Publish experimental JARVIS APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (example: v1.4)'
        required: true
        default: 'v1.4'
        type: string

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Assemble test APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Jarvis-${{ inputs.version }}-experimental-debug.apk
          sha256sum Jarvis-${{ inputs.version }}-experimental-debug.apk > SHA256SUMS.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Invalid version tag"; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists. Refusing to replace it."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "Jarvis-$RELEASE_TAG-experimental-debug.apk" SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "JARVIS $RELEASE_TAG (experimental debug)" \
            --notes "Experimental developer/testing build. Android 8+, optional Vision/SC on Android 11+. This is debug-signed and has not been independently verified on real devices. Not production-grade. Review README, SECURITY.md and docs/PRIVACY.md before enabling Accessibility or entering API keys." \
            --prerelease
