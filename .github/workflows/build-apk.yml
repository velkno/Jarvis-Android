name: Build Jarvis APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract Jarvis project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q Jarvis-v1.2-build-ready-source.zip
          test -f jarvis/gradlew
          patch --batch -p1 < Jarvis-v1.4-features.patch
          cp -a jarvis/. .
          rm -rf jarvis
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          if [ ! -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-34" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          fi
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-v1.4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
