name: Build Jarvis APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract source and apply Jarvis v1.4 patch
        shell: bash
        run: |
          set -euo pipefail
          unzip -q Jarvis-v1.2-build-ready-source.zip
          cp -a jarvis/. .
          rm -rf jarvis
          : > /tmp/advanced-v14.patch
          for part in patches/advanced-v1.4.part*; do
            cat "$part" >> /tmp/advanced-v14.patch
            printf '\n' >> /tmp/advanced-v14.patch
          done
          patch --batch -p1 < /tmp/advanced-v14.patch
          patch --batch -p1 < patches/advanced-v1.4-nullability.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-34" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          fi
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload Jarvis APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-v1.4-Advanced-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
