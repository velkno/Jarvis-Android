name: Feature request
description: Suggest a useful and consent-respecting capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include Android permissions needed, user-consent workflow and any privacy impact.
    validations:
      required: true
